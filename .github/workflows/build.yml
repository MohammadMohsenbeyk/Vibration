name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate project (unzip if only VibeTrainer.zip was uploaded)
        run: |
          if [ -f VibeTrainer.zip ]; then
            unzip -o VibeTrainer.zip -d extracted
            echo "PROJECT_DIR=extracted/VibeTrainer" >> "$GITHUB_ENV"
          elif [ -f build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f VibeTrainer/build.gradle.kts ]; then
            echo "PROJECT_DIR=VibeTrainer" >> "$GITHUB_ENV"
          else
            echo "Could not locate the Gradle project" && exit 1
          fi

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeTrainer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
